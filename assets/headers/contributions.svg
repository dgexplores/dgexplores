<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Contributions: Space Shooter">
  <defs>
    <linearGradient id="theme" x2="1" y2="0">
      <stop stop-color="#A855F7"/><stop offset="34%" stop-color="#EC4899"/>
      <stop offset="68%" stop-color="#F97316"/><stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>
  <style>
    text {font-family:'Courier New',monospace;font-weight:700}
    .cursor {animation:blink 1.2s step-end infinite}
    @keyframes blink {50% {opacity:0}}
    @media (prefers-reduced-motion:reduce) {.cursor {animation:none}}
  </style>
  <rect x="3" y="3" width="1194" height="144" rx="14" fill="#080810" stroke="url(#theme)" stroke-width="3"/>
  <circle cx="30" cy="30" r="6" fill="#FF5F57"/>
  <circle cx="52" cy="30" r="6" fill="#FEBC2E"/>
  <circle cx="74" cy="30" r="6" fill="#28C840"/>
  <text x="100" y="37" font-size="18" fill="#C084FC">deepak@system:~/contributions</text>
  <line x1="3" y1="55" x2="1197" y2="55" stroke="url(#theme)"/>
  <text x="30" y="100" font-size="20" fill="#FACC15">$ contributions --play space-shooter</text>
  <rect class="cursor" x="478" y="81" width="12" height="22" fill="#FACC15"/>
  <text x="30" y="130" font-size="15" fill="#F472B6">&gt; one year of commits. one ship. keep building.</text>
</svg>

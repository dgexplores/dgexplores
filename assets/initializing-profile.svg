<svg xmlns="http://www.w3.org/2000/svg"
     width="1700"
     height="172"
     viewBox="0 0 1700 172">

  <defs>
    <linearGradient id="cyberGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A18"/>
      <stop offset="40%" stop-color="#FFB000"/>
      <stop offset="72%" stop-color="#FFD54A"/>
      <stop offset="100%" stop-color="#B86B1B"/>
    </linearGradient>
  </defs>

  <style>
    .ascii {
      fill: url(#cyberGradient);
      font-family: "DejaVu Sans Mono", "Courier New", monospace;
      font-size: 12px;
      font-weight: bold;
      white-space: pre;
    }
    .boot-progress { transform-origin: 0 0; animation: boot-load 2.8s ease-out both; }
    .boot-loading { animation: boot-loading 2.8s step-end both; }
    .boot-ready { animation: boot-ready 2.8s step-end both; }
    .boot-label { font-family: "Courier New", monospace; font-size: 40px; font-weight: bold; }
    @keyframes boot-load { 0% {transform:scaleX(0.02)} 35% {transform:scaleX(0.36)} 70% {transform:scaleX(0.72)} 100% {transform:scaleX(1)} }
    @keyframes boot-loading { 0% {opacity:1} 100% {opacity:0} }
    @keyframes boot-ready { 0% {opacity:0} 100% {opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      .boot-progress, .boot-loading, .boot-ready { animation:none; }
      .boot-loading {opacity:0} .boot-ready {opacity:1}
    }
  </style>


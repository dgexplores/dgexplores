      .category { font-size:12px; font-weight:800; letter-spacing:1px; fill:#F472B6; }
      .label { font-size:12px; font-weight:800; letter-spacing:1px; fill:#FACC15; }
      .feature { font-size:15px; font-weight:700; fill:#D7DCE5; }
      .stack { font-size:14px; font-weight:700; fill:#C084FC; }
      .repo { font-size:13px; font-weight:800; fill:#F97316; }

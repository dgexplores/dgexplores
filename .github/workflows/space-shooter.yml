name: Refresh Space Shooter

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-space-shooter.py
      - .github/workflows/space-shooter.yml

permissions:
  contents: write

concurrency:
  group: space-shooter
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install generator
        run: python -m pip install gh-space-shooter==2.0.5
      - name: Generate themed animation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate-space-shooter.py dgexplores --output assets/space-shooter.gif --strategy random --fps 20
      - name: Commit animation
        run: |
          python -c "from PIL import Image; Image.open('assets/space-shooter.gif').convert('RGB').save('assets/space-shooter-static.png')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/space-shooter.gif assets/space-shooter-static.png
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Space Shooter contribution animation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
